<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="background_color" content="#ffffff">
    <meta name="google" content="notranslate">
    <title>Super memory cards</title>
    <link rel="canonical" href="https://dragonhtmil.github.io/mnts.memorycards.org/">
    <link rel="manifest" href="" id="manifestTestLoad">
    <link rel="preload" href="index_data/fonts/gintocopilot.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="index_data/styles/loading_style.css">
    <link rel="stylesheet" href="index_data/styles/roots.css">
    <link rel="stylesheet" href="index_data/styles/styles.css">
    <link rel="stylesheet" href="index_data/styles/styles_repeats.css">
    <link rel="stylesheet" href="index_data/styles/animations.css">
  </head>
  <body>
    <div id="gameLogo">
      <img src="index_data/textures/system/game_logo.jpg" alt="Game Logo">
      <div></div>
    </div>
    <div class="container" id="loading" style="display: flex;">
      <div class="loading">
        <div class="loading-img" id="loadingContiner">
          <div class="animate-img" id="animateImg"></div>
        </div>
      </div>
      <div class="text-logo"></div>
      <div class="loading-footer" id="loadingFooter">
        <div class="loading-texts">
          <div id="loadingText">...</div>
          <div id="imageCount">0</div>
          <div id="widthernum">0</div>
        </div>
        <div class="widther">
          <div style="width: 0;" id="widther"></div>
        </div>
      </div>
      <div id="loadedbar" class="loading-images">
        <div class="blocker"></div>
      </div>
    </div>
    <button id="spOpener" onclick="openSidePanel();"></button>
    <div class="side-panel hiddened" id="sidePanel">
      <div class="pairs-container">
        <div id="pairs">...</div>
        In code progress...
      </div>
      <div class="panel-lower">
        <button onclick="document.getElementById('menu').style.display='block';" id="menuSettings">...</button>
      </div>
    </div>
    <div class="modal" id="menu">
      <div class="modal-content">
        <div id="menuTitleLang">...</div>
        <button class="close-button" onclick="document.getElementById('menu').style.display='none';"></button>
        <div class="in-modal-content">
          In code progress...
        </div>
      </div>
    </div>
    <header id="header">
      <button id="resetAreaButton"></button>
    </header>
    <div class="game-area" id="gameArea"></div>
    <div class="smg-continer" id="smgContiner">
      <div id="message">...</div>
    </div>
    <div id="winModal" class="modal" style="display: none;">
      <div class="modal-content">
      <div id="noticeTitleLang">...</div>
        <button class="close-button" id="close"></button>
        <div class="in-modal-content" id="progressingALost">
          <div class="gettedscore" id="winScore">...</div>
        </div>
      </div>
    </div>
    <!-- Scripts -->
    <script src="index_data/scripts/lets.js"></script>
    <script src="index_data/scripts/system.js"></script>
    <script src="index_data/scripts/side_panel.js"></script>
    <script src="index_data/scripts/icons.js"></script>
    <script src="index_data/scripts/registrations.js"></script>
    <script src="index_data/scripts/langs/language_en.js"></script>
    <script src="index_data/scripts/langs/language_ru.js"></script>
    <script src="index_data/scripts/langs/language_he.js"></script>
    <script src="index_data/scripts/languages_loader.js"></script>
    <script src="index_data/scripts/loading_system.js"></script>
    <script src="index_data/scripts/window_click.js"></script>
    <script src="index_data/scripts/window_load.js"></script>
    <script src="index_data/scripts/sw_loader.js"></script>
    <div id="scriptContainer"></div>
  </body>
</html>
